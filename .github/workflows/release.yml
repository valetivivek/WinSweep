name: Release

# Push a tag like `v0.2.0` to trigger a build and publish installers to a
# GitHub Release. Manual dispatch is also supported for dry runs without a tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-dev', github.run_number) }}
          releaseName: "WinSweep ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-dev', github.run_number) }}"
          releaseBody: |
            Download the `.msi` or `.exe` installer below.

            Windows SmartScreen may warn that the publisher is unverified — this
            release is built directly from the source on this tag and is not
            code-signed yet. Click **More info → Run anyway** to install.
          releaseDraft: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          args: ${{ matrix.args }}
